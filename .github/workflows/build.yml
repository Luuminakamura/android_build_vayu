name: Compilação do Sistema

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Libertar Espaço em Disco no Servidor
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get clean
          echo "Espaço em disco após limpeza:"
          df -h /

      - name: Instalar Dependências de Compilação
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev libgl1-mesa-dev libxml2 libxml2-utils \
            lzop m4 pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip
